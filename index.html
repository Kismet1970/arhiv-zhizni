<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Архив жизни — Мобильный учебник</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:#171717;background:#f5f5f7}
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7}
main{max-width:760px;margin:auto;padding:18px 16px 40px}
h1{font-size:25px;margin:8px 0 5px}
h2{font-size:20px;margin:20px 0 10px}
p{line-height:1.45}
.card,.panel{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #00000012}
input{width:100%;font-size:16px;padding:13px;border:1px solid #c7c7cc;border-radius:12px;background:#fff}
button{border:0;border-radius:12px;padding:12px 15px;font-size:16px;background:#111;color:#fff;margin:6px 6px 0 0}
button.secondary{background:#e9e9ed;color:#111}
button:disabled{opacity:.45}
.item{display:flex;align-items:center;gap:10px;padding:14px 2px;border-bottom:1px solid #eee}
.item:last-child{border-bottom:0}
.icon{font-size:22px;width:28px;text-align:center}
.name{flex:1;font-size:16px}
.small{font-size:13px;color:#666}
.status{padding:11px 13px;border-radius:12px;background:#eee;margin-top:12px;white-space:pre-wrap}
.error{background:#ffe9e9;color:#8b0000}
.answer{display:none;margin-top:15px;padding-top:15px;border-top:1px solid #eee}
.deck-title{font-size:22px;font-weight:700}
.example{font-size:19px;line-height:1.45;margin-top:16px}
.translation{font-size:17px;line-height:1.45;margin-top:10px;color:#555}
audio{width:100%;margin-top:15px}
.progress{font-size:13px;color:#666}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Архив жизни</h1>
<div class="small">Мобильный учебник</div>

<section id="connect" class="panel">
<h2>Яндекс Диск</h2>
<p>Вставьте публичную ссылку на папку <b>КОЛОДЫ</b>.</p>
<input id="publicUrl" type="url" placeholder="https://disk.yandex.ru/d/..." autocomplete="off">
<button id="connectBtn">Подключить папку</button>
<div id="status" class="status">Ссылка ещё не подключена.</div>
</section>

<section id="browser" class="panel hidden">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
<h2 id="locationTitle">КОЛОДЫ</h2>
<button id="upBtn" class="secondary">Назад</button>
</div>
<div id="items"></div>
</section>

<section id="study" class="panel hidden">
<div class="progress" id="progress"></div>
<div class="deck-title" id="cardTitle"></div>
<div class="small" id="cardMeta"></div>
<div class="example" id="example"></div>
<div class="translation" id="translation"></div>
<audio id="audio" controls preload="metadata"></audio>
<div id="answer" class="answer"></div>
<div style="margin-top:12px">
<button id="showBtn">Показать ответ</button>
<button id="repeatBtn" class="secondary">Повторить</button>
<button id="knowBtn">Знаю</button>
</div>
<div>
<button id="prevBtn" class="secondary">←</button>
<button id="nextBtn">→</button>
<button id="backDeckBtn" class="secondary">К колодам</button>
</div>
</section>
</main>

<script>
(() => {
const API='https://cloud-api.yandex.net/v1/disk/public/resources';
const DOWNLOAD='https://cloud-api.yandex.net/v1/disk/public/resources/download';
const PROXY='https://api.allorigins.win/raw?url=';

let publicKey='';
let currentPath='';
let pathStack=[];
let deck=null;
let cards=[];
let index=0;

const $=id=>document.getElementById(id);
const status=(msg,error=false)=>{
  $('status').textContent=msg;
  $('status').className='status'+(error?' error':'');
};

function normalizeUrl(v){
  v=(v||'').trim();
  try{
    const u=new URL(v);
    return u.href;
  }catch(e){ return v; }
}

async function api(path=''){
  const u=new URL(API);
  u.searchParams.set('public_key',publicKey);
  u.searchParams.set('path',path || '/');
  u.searchParams.set('limit','1000');
  const r=await fetch(u.href,{cache:'no-store'});
  if(!r.ok) throw new Error('Яндекс API: HTTP '+r.status);
  return await r.json();
}

function setConnected(){
  $('browser').classList.remove('hidden');
  $('connect').classList.remove('hidden');
}

async function connect(){
  const v=normalizeUrl($('publicUrl').value);
  if(!v){status('Вставьте публичную ссылку на папку.',true);return;}
  publicKey=v;
  currentPath='';
  pathStack=[];
  status('Проверяю публичную папку…');
  try{
    const data=await api('/');
    if(!data || !data._embedded) throw new Error('Яндекс не вернул содержимое папки.');
    localStorage.setItem('archive_public_key',publicKey);
    setConnected();
    renderFolder(data,'КОЛОДЫ');
    status('Папка подключена.');
  }catch(e){
    status('Не удалось подключить папку.\n\n'+friendlyError(e),true);
  }
}

function friendlyError(e){
  const s=String(e&&e.message||e);
  if(/Failed to fetch|NetworkError|Load failed|CORS/i.test(s))
    return 'Safari заблокировал сетевой запрос из этой страницы. Если страница открыта как обычный HTTPS-сайт, попробуем резервную загрузку.';
  return s;
}

function renderFolder(data,title){
  $('locationTitle').textContent=title;
  $('items').innerHTML='';
  const items=(data._embedded && data._embedded.items)||[];
  if(!items.length){
    $('items').innerHTML='<div class="small">Папка пуста или доступ к содержимому не предоставлен.</div>';
    return;
  }
  items.sort((a,b)=>{
    if(a.type!==b.type) return a.type==='dir'?-1:1;
    return (a.name||'').localeCompare(b.name||'','ru');
  });
  for(const item of items){
    if(item.type==='dir' || (item.type==='file' && /\.json$/i.test(item.name||''))){
      const row=document.createElement('div');
      row.className='item';
      const icon=document.createElement('div'); icon.className='icon';
      icon.textContent=item.type==='dir'?'📁':'📚';
      const name=document.createElement('div'); name.className='name';
      name.textContent=item.name;
      const small=document.createElement('div'); small.className='small';
      small.textContent=item.type==='dir'?'Папка':'JSON-колода';
      name.appendChild(small);
      row.append(icon,name);
      row.addEventListener('click',()=>item.type==='dir'?enterFolder(item):openDeck(item));
      $('items').appendChild(row);
    }
  }
}

async function enterFolder(item){
  pathStack.push({path:currentPath,title:$('locationTitle').textContent});
  currentPath=item.path || ((currentPath?currentPath+'/':'/')+item.name);
  $('items').innerHTML='<div class="small">Загрузка…</div>';
  try{
    const data=await api(currentPath);
    renderFolder(data,item.name);
  }catch(e){
    $('items').innerHTML='';
    status('Не удалось открыть папку.\n\n'+friendlyError(e),true);
  }
}

$('upBtn').addEventListener('click',async()=>{
  if(!pathStack.length){return;}
  const prev=pathStack.pop();
  currentPath=prev.path;
  try{
    const data=await api(currentPath||'/');
    renderFolder(data,prev.title);
    status('Папка подключена.');
  }catch(e){status(friendlyError(e),true);}
});

async function getDownloadHref(path){
  const u=new URL(DOWNLOAD);
  u.searchParams.set('public_key',publicKey);
  u.searchParams.set('path',path);
  const r=await fetch(u.href,{cache:'no-store'});
  if(!r.ok) throw new Error('Не удалось получить ссылку на JSON: HTTP '+r.status);
  const d=await r.json();
  if(!d.href) throw new Error('Яндекс не вернул ссылку на файл.');
  return d.href;
}

async function fetchJsonDirect(href){
  const r=await fetch(href,{cache:'no-store'});
  if(!r.ok) throw new Error('Загрузка JSON: HTTP '+r.status);
  return await r.json();
}

async function fetchJsonProxy(href){
  const r=await fetch(PROXY+encodeURIComponent(href),{cache:'no-store'});
  if(!r.ok) throw new Error('Резервная загрузка JSON: HTTP '+r.status);
  return await r.json();
}

async function openDeck(item){
  status('Загружаю колоду…');
  try{
    const href=await getDownloadHref(item.path);
    let data;
    try{
      data=await fetchJsonDirect(href);
    }catch(first){
      data=await fetchJsonProxy(href);
    }
    if(data.format!=='my-knowledge-deck-v1' || !Array.isArray(data.cards))
      throw new Error('Файл загружен, но это не колода формата my-knowledge-deck-v1.');
    deck=data;
    cards=data.cards;
    index=0;
    $('browser').classList.add('hidden');
    $('study').classList.remove('hidden');
    showCard();
    status('Колода загружена.');
  }catch(e){
    status('Не удалось загрузить колоду.\n\n'+friendlyError(e),true);
  }
}

function showCard(){
  if(!cards.length)return;
  const c=cards[index]||{};
  $('progress').textContent=(deck.name||'Колода')+' · '+(index+1)+' / '+cards.length;
  $('cardTitle').textContent=c.title||'';
  $('cardMeta').textContent=[c.work,c.author,c.fame].filter(Boolean).join(' · ');
  $('example').textContent=c.example||'';
  $('translation').textContent=c.exampleTranslation||'';
  $('answer').style.display='none';
  $('answer').textContent='';
  $('audio').removeAttribute('src');
  if(typeof c.audio==='string' && c.audio.startsWith('data:audio/')){
    $('audio').src=c.audio;
  }
}

$('showBtn').onclick=()=>{
  const c=cards[index]||{};
  $('answer').textContent=c.exampleTranslation||'Ответ / перевод не указан.';
  $('answer').style.display='block';
};
$('repeatBtn').onclick=()=>showCard();
$('knowBtn').onclick=()=>{
  if(index<cards.length-1){index++;showCard();}
  else alert('Колода закончена.');
};
$('prevBtn').onclick=()=>{if(index>0){index--;showCard();}};
$('nextBtn').onclick=()=>{if(index<cards.length-1){index++;showCard();}};
$('backDeckBtn').onclick=()=>{
  $('study').classList.add('hidden');
  $('browser').classList.remove('hidden');
  loadCurrent();
};

async function loadCurrent(){
  try{
    const data=await api(currentPath||'/');
    renderFolder(data,$('locationTitle').textContent);
  }catch(e){status(friendlyError(e),true);}
}

$('connectBtn').onclick=connect;

const saved=localStorage.getItem('archive_public_key');
if(saved){
  $('publicUrl').value=saved;
  publicKey=saved;
}
})();
</script>
</body>
</html>
